name: verify

# 为什么 CI 只跑 1–10 层：第 11 层要连本机的 Magpie 网关（84 个模型），
# 那不是一个干净的 runner 上能假设存在的东西。把它标成"可选"不是免责，
# 是它测的是"模型在这个环境里的分数"，而模型分数不该被每次 push 重算。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装包（零依赖，纯标准库）
        run: pip install -e .

      - name: 测试套件
        run: python -m pytest -o addopts= -q

      - name: 十一层验收（第 11 层自动跳过：没网关）
        run: bash scripts/verify.sh

      - name: README 数字可复算
        run: python scripts/check_readme.py

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t arga-clone:ci .

      # 判据不是"镜像能构建"，是"镜像里的东西真的能干活"：
      # 起服务 → 探活 → 用 SDK 走一遍 provision/act/grade/teardown。
      - name: 镜像起服务并跑一轮真活
        run: |
          docker run -d --name arga -p 8787:8787 arga-clone:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/healthz
          python - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:8787"
          req = urllib.request.Request(
              base + "/admin/runs",
              data=json.dumps({"twins": "stripe", "ttl": 120,
                               "scenario_id": "ecom-duplicate-billing"}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req) as resp:
              view = json.load(resp)
          assert view["twins"] == ["stripe"], view
          print("provision ok:", view["run_id"])
          PY
          docker rm -f arga
